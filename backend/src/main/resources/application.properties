# ===================================================================
# Foundly — Configuration de l'application Spring Boot
# Base de données locale : foundly-db (MySQL via phpMyAdmin)
# ===================================================================

spring.application.name=foundly

# -------------------------------------------------------------------
# Datasource MySQL — variables d'environnement avec valeurs par défaut locales
# (DB_URL, DB_USERNAME, DB_PASSWORD)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foundly-db?useSSL=false&serverTimezone=Africa/Casablanca&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de connexions HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# -------------------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Serveur
# -------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/api/v1

# -------------------------------------------------------------------
# Upload de fichiers (pièces justificatives — max 10 Mo)
# -------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Répertoire de stockage des documents uploadés
foundly.upload.dir=./uploads

# -------------------------------------------------------------------
# JWT — ATTENTION : remplacer jwt.secret par une valeur sécurisée en production
#         via la variable d'environnement JWT_SECRET (min. 32 caractères, aléatoire)
# -------------------------------------------------------------------
jwt.secret=${JWT_SECRET:F0undly$3cr3tK3y_DigitalisationMaroc_2026!XK7zP9qR}
jwt.access-ttl-seconds=900
jwt.refresh-ttl-days=7

# -------------------------------------------------------------------
# Mail (notifications — désactivé par défaut en dev)
# -------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.backend=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# CORS (frontend Angular sur port 4200, ou 5500, ou 3000)
# -------------------------------------------------------------------
foundly.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000
